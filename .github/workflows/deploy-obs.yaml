name: CI/CD Pipeline - Simcc Back

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"

env:
  REDIS_ENABLED: 'false'
  OPENAI_API_KEY: 'dummy-key-for-tests'
  
  DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/db
  ADMIN_DATABASE_URL: postgresql+asyncpg://postgres:postgres@simcc-admin-db:5432/db_admin

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Instalar Poetry
        run: pipx install poetry

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "poetry"

      - name: Instalar Dependências
        run: poetry install --no-interaction

      - name: Rodar Testes
        run: poetry run task test

  deploy:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST_DNS }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -euo pipefail

            # Caminho ajustado
            cd /opt/apps/prod/observatorio/observatorio-back

            # Atualiza o código
            git pull origin main --ff-only

            # Volta pra pasta certa
            cd /opt/apps/prod/observatorio

            # Constrói a imagem localmente e recria o container usando o compose.yaml atual
            docker compose up -d --build --force-recreate api

            # Limpa imagens que ficaram órfãs (dangling) após o novo build
            docker image prune -f

            # Verifica o status
            docker compose ps