[project]
name = "simcc"
version = "4.5.0"
description = ""
authors = [
    {name = "meirelesgc",email = "geu_costa@outlook.com"}
]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "fastapi[standard] (>=0.136.1,<0.137.0)",
    "pydantic-settings (>=2.14.1,<3.0.0)",
    "sqlalchemy (>=2.0.49,<3.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "psycopg[binary] (>=3.3.4,<4.0.0)",
    "pytest (>=9.0.3,<10.0.0)",
    "testcontainers[postgres] (>=4.14.2,<5.0.0)",
    "pytest-asyncio (>=1.3.0,<2.0.0)",
    "unidecode (>=1.4.0,<2.0.0)",
    "zeep (>=4.3.1,<5.0.0)",
    "mkdocs (>=1.6.1,<2.0.0)",
    "mkdocs-material (>=9.7.6,<10.0.0)",
    "langchain-openai (>=1.2.1,<2.0.0)",
    "alembic (>=1.18.4,<2.0.0)",
    "nltk (>=3.9.4,<4.0.0)",
    "firebase-admin (>=7.4.0,<8.0.0)",
    "respx (>=0.23.1,<0.24.0)",
    "numpy (>=2.3,<2.4)",
    "docker (>=7.0)",
    "httpie (>=3.2.4,<4.0.0)",
    "polars[rtcompat] (>=1.42.0,<2.0.0)",
    "structlog (>=26.1.0,<27.0.0)",
    "xlsxwriter (>=3.2.9,<4.0.0)",
    "scrapy (>=2.17.0,<3.0.0)",
    "pgvector (>=0.5.0,<0.6.0)",
    "redis (>=5.0.0,<6.0.0)",
    "opentelemetry-api (>=1.30.0,<2.0.0)",
    "opentelemetry-sdk (>=1.30.0,<2.0.0)",
    "opentelemetry-exporter-otlp (>=1.30.0,<2.0.0)",
    "opentelemetry-instrumentation-fastapi (>=0.51b0,<1.0.0)",
    "opentelemetry-instrumentation-sqlalchemy (>=0.51b0,<1.0.0)",
    "opentelemetry-instrumentation-redis (>=0.51b0,<1.0.0)",
    "opentelemetry-instrumentation-httpx (>=0.51b0,<1.0.0)",
    "httpx2 (>=2.12.0,<3.0.0)",
]

[tool.poetry]
packages = [{include = "simcc", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 79
extend-exclude = ['migrations']

[tool.ruff.lint]
preview = true
select = ['I', 'F', 'E', 'W', 'PL', 'PT']

[tool.ruff.format]
preview = true
quote-style = 'single'

[tool.pytest.ini_options]
pythonpath = ["src", "."]
addopts = "-m 'not ai_live' -p no:warnings"
timeout = "60"
env_files = [".env"]
markers = [
    "unit: testes unitários rápidos e isolados com mocks",
    "integration: testes de integração com banco de dados",
    "ai_live: testes ponta-a-ponta reais com OpenAI (gastam tokens e exigem OPENAI_API_KEY)",
]

[tool.taskipy.tasks]
run = 'fastapi dev src/simcc --reload-dir "src/simcc"'

test = 'pytest -s -x --cov=src/simcc'
test_live = 'pytest -o addopts="" -s -x -v -m ai_live --cov=src/simcc'

cov = 'coverage html'
deploy = 'ssh gmcosta@172.16.0.243 -p 30507 -i ~/.ssh/id_ed25519 "cd /opt/simcc/simcc-back && git pull && cd .. && docker compose up --build -d --force-recreate api"'

[dependency-groups]
dev = [
    "pytest-cov (>=7.1.0,<8.0.0)",
    "taskipy (>=1.14.1,<2.0.0)",
    "ruff (>=0.15.12,<0.16.0)",
    "factory-boy (>=3.3.3,<4.0.0)",
    "pytest (>=9.0.3,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "testcontainers[postgres] (>=4.14.2,<5.0.0)",
    "mkdocs (>=1.6.1,<2.0.0)",
    "mkdocs-material (>=9.7.6,<10.0.0)",
    "respx (>=0.23.1,<0.24.0)",
    "pytest-dotenv (>=0.5.2,<0.6.0)"
]
