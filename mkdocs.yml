site_name: SIMCC
site_description: Observatório e Inteligência Científica do Estado da Bahia
site_author: SIMCC

theme:
  name: material
  language: pt-BR
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    # Modo Claro (Default)
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Alternar para modo escuro
    # Modo Escuro
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Alternar para modo claro
  font:
    text: Lexend
    code: Ubuntu

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html

nav:
  - Início: index.md
  - Conceitos da V2:
      - Arquitetura e MVs: conceitos/arquitetura.md
      - Filtros e Busca Textual: conceitos/filtros-e-busca.md
      - Facets e Evidências: conceitos/facets-e-evidencias.md
  - Guia de Contribuição:
      - Visão Geral: guia-contribuicao/index.md
      - 1. Criação de Rotinas e Serviços: guia-contribuicao/rotinas.md
      - 2. Criação de Endpoints: guia-contribuicao/endpoints.md
      - 3. Criação de Testes: guia-contribuicao/testes.md
  - Recursos em Construção: em-construcao.md

markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format