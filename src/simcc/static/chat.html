<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MarIA - Teste de Streaming</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            font-size: 14px;
            color: #222;
        }

        header {
            padding: 8px 12px;
            border-bottom: 1px solid #ccc;
        }

        .main {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .col {
            border-right: 1px solid #ccc;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .col:last-child {
            border-right: none;
        }

        .col-results {
            width: 28%;
        }

        .col-diagnostics {
            width: 28%;
        }

        .col-chat {
            flex: 1;
        }

        .col h2 {
            font-size: 12px;
            text-transform: uppercase;
            padding: 8px;
            border-bottom: 1px solid #ddd;
            background: #f5f5f5;
        }

        .col-body {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }

        .col-body pre {
            white-space: pre-wrap;
            word-break: break-word;
            font-size: 12px;
        }

        .item {
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 6px 8px;
            margin-bottom: 6px;
        }

        .item b {
            font-size: 12.5px;
        }

        .item .sub {
            color: #666;
            font-size: 11.5px;
        }

        #chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .msg {
            max-width: 85%;
            padding: 8px 10px;
            border-radius: 6px;
            border: 1px solid #ddd;
            white-space: pre-wrap;
        }

        .msg.user {
            align-self: flex-end;
            background: #eef2ff;
        }

        .msg.bot {
            align-self: flex-start;
            background: #fafafa;
            width: 100%;
        }

        form {
            display: flex;
            gap: 6px;
            padding: 8px;
            border-top: 1px solid #ccc;
        }

        input[type=text] {
            flex: 1;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        button {
            padding: 8px 14px;
            border: 1px solid #999;
            background: #eee;
            border-radius: 4px;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .empty {
            color: #888;
            font-size: 12.5px;
        }
    </style>
</head>

<body>

    <header>
        <strong>MarIA</strong> — teste de streaming (SSE)
    </header>

    <div class="main">
        <div class="col col-results">
            <h2>Itens retornados</h2>
            <div class="col-body" id="results-panel">
                <div class="empty">Nenhum registro ainda.</div>
            </div>
        </div>

        <div class="col col-diagnostics">
            <h2>Diagnóstico / telemetria</h2>
            <div class="col-body" id="diagnostics-panel">
                <div class="empty">Aguardando execução.</div>
            </div>
        </div>

        <div class="col col-chat">
            <div id="chat-messages">
                <div class="msg bot">Olá, pode enviar sua pergunta para testar o streaming.</div>
            </div>
            <form id="chat-form">
                <input type="text" id="chat-input" placeholder="Digite sua pergunta..." autocomplete="off" required>
                <button type="button" id="stop-btn" style="display:none;">Parar</button>
                <button type="submit" id="send-btn">Enviar</button>
            </form>
        </div>
    </div>

    <script>
        const chatMessages = document.getElementById('chat-messages');
        const chatForm = document.getElementById('chat-form');
        const chatInput = document.getElementById('chat-input');
        const sendBtn = document.getElementById('send-btn');
        const stopBtn = document.getElementById('stop-btn');
        const resultsPanel = document.getElementById('results-panel');
        const diagnosticsPanel = document.getElementById('diagnostics-panel');

        let currentAbortController = null;
        const sessionId = 'sess_' + Math.random().toString(36).slice(2, 9);

        function scrollToBottom() {
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function renderResults(data) {
            resultsPanel.innerHTML = '';
            const researchers = data.researchers || [];
            const productions = data.productions || [];

            if (researchers.length === 0 && productions.length === 0) {
                resultsPanel.innerHTML = '<div class="empty">Nenhum item associado.</div>';
                return;
            }

            researchers.forEach(r => {
                const div = document.createElement('div');
                div.className = 'item';
                div.innerHTML = `<b>${r.name}</b><div class="sub">${r.institution || ''}</div>`;
                resultsPanel.appendChild(div);
            });

            productions.forEach(p => {
                const div = document.createElement('div');
                div.className = 'item';
                const author = p.researcher ? p.researcher.name : (p.authors || '');
                div.innerHTML = `<b>${p.title}</b><div class="sub">${p.type || ''} · ${p.year || ''} · ${author}</div>`;
                resultsPanel.appendChild(div);
            });
        }

        function renderDiagnostics(data, telemetry) {
            diagnosticsPanel.innerHTML = '';

            const f = data.filters || {};
            const meta = document.createElement('pre');
            meta.textContent = JSON.stringify({
                intent: data.intent,
                filters: f,
                sources: data.sources
            }, null, 2);
            diagnosticsPanel.appendChild(meta);

            if (telemetry) {
                const tel = document.createElement('pre');
                tel.textContent = JSON.stringify(telemetry, null, 2);
                diagnosticsPanel.appendChild(tel);
            }
        }

        stopBtn.addEventListener('click', () => {
            if (currentAbortController) {
                currentAbortController.abort();
                currentAbortController = null;
            }
        });

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const query = chatInput.value.trim();
            if (!query) return;

            const userMsg = document.createElement('div');
            userMsg.className = 'msg user';
            userMsg.textContent = query;
            chatMessages.appendChild(userMsg);

            chatInput.value = '';
            chatInput.disabled = true;
            sendBtn.style.display = 'none';
            stopBtn.style.display = 'inline-block';

            resultsPanel.innerHTML = '<div class="empty">Carregando...</div>';
            diagnosticsPanel.innerHTML = '<div class="empty">Processando...</div>';

            const botMsg = document.createElement('div');
            botMsg.className = 'msg bot';
            botMsg.textContent = '...';
            chatMessages.appendChild(botMsg);
            scrollToBottom();

            currentAbortController = new AbortController();
            let fullText = '';
            let doneTelemetry = null;
            let lastMetadata = null;

            try {
                const response = await fetch('/ai/chat/ask/stream', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query, session_id: sessionId }),
                    signal: currentAbortController.signal
                });

                if (!response.ok) throw new Error('Erro na resposta do servidor');

                const reader = response.body.getReader();
                const decoder = new TextDecoder('utf-8');
                let buffer = '';

                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop();

                    for (const line of lines) {
                        const trimmed = line.trim();
                        if (!trimmed.startsWith('data: ')) continue;

                        const jsonStr = trimmed.slice(6);
                        if (!jsonStr) continue;

                        let event;
                        try {
                            event = JSON.parse(jsonStr);
                        } catch (err) {
                            console.error('Falha no parse do evento SSE:', err, jsonStr);
                            continue;
                        }

                        if (event.type === 'metadata' && event.data) {
                            lastMetadata = event.data;
                            renderResults(event.data);
                            renderDiagnostics(event.data, null);
                        } else if (event.type === 'delta' && event.content) {
                            fullText += event.content;
                            botMsg.textContent = fullText;
                            scrollToBottom();
                        } else if (event.type === 'error') {
                            const err = document.createElement('div');
                            err.style.color = 'red';
                            err.textContent = event.message || 'Erro ao processar consulta.';
                            diagnosticsPanel.appendChild(err);
                        } else if (event.type === 'done') {
                            doneTelemetry = (event.data && event.data.telemetry) || null;
                        }
                    }
                }

                if (lastMetadata) renderDiagnostics(lastMetadata, doneTelemetry);

            } catch (error) {
                if (error.name === 'AbortError') {
                    botMsg.textContent = fullText + ' (interrompido)';
                } else {
                    botMsg.textContent = 'Erro ao conectar com a MarIA.';
                }
            } finally {
                chatInput.disabled = false;
                sendBtn.style.display = 'inline-block';
                stopBtn.style.display = 'none';
                currentAbortController = null;
                chatInput.focus();
                scrollToBottom();
            }
        });
    </script>
</body>

</html>
