services:
  api:
    build: .
    image: ${COMPOSE_PROJECT_NAME}
    entrypoint: [ "/bin/sh", "/app/entrypoint.sh" ]
    ports:
      - "127.0.0.1:${API_PORT}:8000"
    volumes:
      - logs:/app/logs
      - ./google_credentials.json:/app/google_credentials.json:ro
    restart: always

volumes:
  logs:
